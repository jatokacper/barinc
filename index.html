/* Bar Inc 3.2: compact customer purchase feed */
.sale-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #394953;min-width:0}.sale-row:last-of-type{border-bottom:0}.sale-row b{font-size:12px}.sale-amount{white-space:nowrap;color:var(--mint);font-size:12px}.sale-row .small{font-size:11px}

.game{max-width:1500px}

[hidden]{display:none!important}

function nextRenownThreshold(){return RENOWN_BASE*Math.pow(renownGain()+1,1/RENOWN_EXP)}
